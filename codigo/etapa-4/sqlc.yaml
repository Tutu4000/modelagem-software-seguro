# Código de acesso ao banco gerado a partir das migrações e das queries de cada
# módulo. Para regerar: `just sqlc`. Cada módulo tem o próprio pacote, como tem o
# próprio papel no banco (E3.1).
version: "2"

sql:
  - engine: postgresql
    schema: migrations/principal
    queries: internal/files/queries.sql
    gen:
      go: &go
        package: filesdb
        out: internal/files/filesdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time

  - engine: postgresql
    schema: migrations/principal
    queries: internal/queue/queries.sql
    gen:
      go:
        <<: *go
        package: queuedb
        out: internal/queue/queuedb

  - engine: postgresql
    schema: migrations/auditoria
    queries: internal/audit/queries.sql
    gen:
      go:
        <<: *go
        package: auditdb
        out: internal/audit/auditdb
