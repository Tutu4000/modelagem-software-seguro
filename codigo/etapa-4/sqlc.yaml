# Database access generated from the migrations and from each module's queries.
# Regenerate with `just sqlc`. Each module gets its own package, just as it has
# its own database role (E3.1).
version: "2"

sql:
  - engine: postgresql
    schema: migrations/main
    queries: internal/files/queries.sql
    gen:
      go: &go
        package: filesdb
        out: internal/files/filesdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true

  - engine: postgresql
    schema: migrations/main
    queries: internal/queue/queries.sql
    gen:
      go:
        <<: *go
        package: queuedb
        out: internal/queue/queuedb

  - engine: postgresql
    schema: migrations/main
    queries: internal/orders/queries.sql
    gen:
      go:
        <<: *go
        package: ordersdb
        out: internal/orders/ordersdb

  - engine: postgresql
    schema: migrations/audit
    queries: internal/audit/queries.sql
    gen:
      go:
        <<: *go
        package: auditdb
        out: internal/audit/auditdb
