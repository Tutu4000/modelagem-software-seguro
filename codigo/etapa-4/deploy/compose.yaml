# Local environment for the Stage 3 architecture. The networks reproduce the
# trust boundaries (backlog section 2). Secrets: run `just secrets` first.

name: nuggetmachine

# Every container: no privilege escalation and resource limits (C11).
x-limits: &limits
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Go binaries: also a read-only filesystem and no capabilities.
x-hardened: &hardened
  <<: *limits
  read_only: true
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=16m"]

services:
  nginx:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    ports: ["443:8443", "8443:9443", "8444:10443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs: ["/tmp:size=128m"]
    secrets: [tls_crt, tls_key]
    networks:
      public: {}
      internal:
        ipv4_address: 172.28.10.10
    depends_on: [api, garage, keycloak]
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m, pids: 128 }

  # Identity provider (E5.3): customer login and staff SSO with MFA. Reached
  # from outside only through nginx, which hides the admin console.
  keycloak:
    <<: *hardened
    build:
      context: ./keycloak
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://localhost:8444
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70
    # Keycloak has no *_FILE option for the database password: it is read
    # from the secret inside the container, so it never shows in the compose
    # file or in `docker inspect`.
    entrypoint: ["bash", "-c"]
    command:
      - >-
        export KC_DB_PASSWORD="$$(cat /run/secrets/db_keycloak_password)" &&
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    tmpfs: ["/tmp:size=64m", "/opt/keycloak/data:size=64m,uid=1000"]
    secrets:
      - db_keycloak_password
      - source: keycloak_realm
        target: /opt/keycloak/data/import/realm.json
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -m1 '"status"' <&3 | grep -q '"UP"'
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g, pids: 512 }

  api:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      TRUSTED_PROXIES: 172.28.10.10
      OIDC_ISSUER: https://localhost:8444/realms/nugget
      OIDC_JWKS_URL: http://keycloak:8080/realms/nugget/protocol/openid-connect/certs
      OIDC_AUDIENCE: api
      DB_HOST: postgres
      DB_FILES_PASSWORD_FILE: /run/secrets/db_files_password
      DB_QUEUE_PASSWORD_FILE: /run/secrets/db_queue_password
      AUDIT_DB_HOST: postgres-audit
      DB_AUDIT_PASSWORD_FILE: /run/secrets/db_audit_password
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: https://localhost:8443
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      AMQP_HOST: rabbitmq:5672
      AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_api_password
      VALKEY_ADDR: valkey:6379
      VALKEY_USER: api
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_api_password
      RATE_LIMIT_PER_MINUTE: "60"
      INTERNAL_ADDR: ":8090"
      GOMEMLIMIT: 400MiB
    secrets:
      - valkey_api_password
      - db_files_password
      - db_queue_password
      - db_audit_password
      - s3_access_key_id
      - s3_secret_access_key
      - rabbitmq_api_password
    networks: [internal]
    depends_on:
      garage-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      valkey: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
      postgres-audit: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m, pids: 256 }

  # Only on the processing network: no database, Valkey or internet, and no
  # Garage key. It reads the files through the message's presigned URL (FC3,
  # E4.2).
  worker:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      AMQP_HOST: rabbitmq:5672
      AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_worker_password
      TASK_TIMEOUT: 60s
      # Below the container limit: Go gives memory back before being killed.
      GOMEMLIMIT: 400MiB
    secrets: [rabbitmq_worker_password]
    networks: [processing]
    depends_on:
      rabbitmq: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m, pids: 128 }

  # Shared state of the API replicas: revoked sessions and per-user rate
  # limits (E5.1, E5.2).
  valkey:
    <<: *hardened
    image: valkey/valkey:9.1.1-alpine@sha256:15568b9cb7eb67f4aed4de018c23f13d344e0e6437b31fe8fb8823dc81ebb3a9
    # Runs directly as the image's valkey user: the entrypoint does not need
    # to chown or switch users, so no capability is required.
    user: valkey
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey:/data
    secrets: [valkey_users_acl, valkey_health_password]
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/valkey_health_password)"
          valkey-cli --user healthcheck --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m, pids: 64 }

  rabbitmq:
    <<: *limits
    image: rabbitmq:4.3.6-alpine@sha256:6931816af1a943f471c038b278835d36692d55dec769232739296bb91b7de0f5
    hostname: rabbitmq
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-nuggetmachine.conf:ro
      - ./rabbitmq/topology.json:/etc/rabbitmq/definitions/02-topology.json:ro
      - rabbitmq:/var/lib/rabbitmq
    secrets:
      - source: rabbitmq_users
        target: /etc/rabbitmq/definitions/01-users.json
    networks: [internal, processing]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m, pids: 512 }

  # Object storage: private bucket, read only through presigned URLs (C03). It
  # is also on the worker's network, which downloads the files through it.
  garage:
    <<: *limits
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    read_only: true
    cap_drop: [ALL]
    environment:
      # Secrets arrive as bind mounts with the host file's permissions.
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    secrets: [garage_rpc_secret, garage_admin_token]
    networks: [internal, processing]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m, pids: 256 }

  garage-init:
    <<: *hardened
    restart: "no"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: garage-init
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN_FILE: /run/secrets/garage_admin_token
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
    secrets: [garage_admin_token, s3_access_key_id, s3_secret_access_key]
    networks: [internal]
    depends_on: [garage]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64m, pids: 64 }

  postgres:
    <<: *limits
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: nugget
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - main:/var/lib/postgresql
      - ../migrations/main:/docker-entrypoint-initdb.d:ro
    secrets: [postgres_password, db_files_password, db_queue_password, db_keycloak_password]
    networks: [internal]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nugget"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m, pids: 256 }

  # Separate instance: whoever compromises the main database cannot reach the
  # trail (C18).
  postgres-audit:
    <<: *limits
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: audit
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_audit_password
    volumes:
      - audit:/var/lib/postgresql
      - ../migrations/audit:/docker-entrypoint-initdb.d:ro
    secrets: [postgres_audit_password, db_audit_password]
    networks: [internal]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "audit"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m, pids: 128 }

  # Stage 5 verification (`just zap`): only starts with the profile, and sits
  # on the public network, like a customer. The token belongs to a test
  # customer with a short validity, and the reports go to
  # evidencias/etapa-5/relatorios-zap.
  zap:
    image: zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    profiles: [zap]
    networks: [public]
    depends_on: [nginx]
    volumes:
      - ../openapi.yaml:/zap/api/openapi.yaml:ro
      - ../secrets/zap_token:/zap/token:ro
      - ../../../evidencias/etapa-5/relatorios-zap:/zap/wrk
    entrypoint: ["bash", "-c"]
    command:
      - >-
        ZAP_AUTH_HEADER_VALUE="Bearer $$(cat /zap/token)"
        exec zap-api-scan.py -t /zap/api/openapi.yaml -f openapi -O https://nginx:8443
        -r zap-relatorio.html -J zap-relatorio.json -w zap-relatorio.md -I

networks:
  # The only network with published ports, and only nginx is on it.
  public: {}
  # No way out to the internet.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # Worker, queue and storage. The worker reaches no database or internet (FC3).
  processing:
    internal: true

volumes:
  main: {}
  audit: {}
  garage: {}
  rabbitmq: {}
  valkey: {}

secrets:
  tls_crt: { file: ../secrets/tls.crt }
  tls_key: { file: ../secrets/tls.key }
  db_keycloak_password: { file: ../secrets/db_keycloak_password }
  keycloak_realm: { file: ../secrets/keycloak_realm.json }
  postgres_password: { file: ../secrets/postgres_password }
  postgres_audit_password: { file: ../secrets/postgres_audit_password }
  db_files_password: { file: ../secrets/db_files_password }
  db_queue_password: { file: ../secrets/db_queue_password }
  db_audit_password: { file: ../secrets/db_audit_password }
  garage_rpc_secret: { file: ../secrets/garage_rpc_secret }
  garage_admin_token: { file: ../secrets/garage_admin_token }
  s3_access_key_id: { file: ../secrets/s3_access_key_id }
  s3_secret_access_key: { file: ../secrets/s3_secret_access_key }
  rabbitmq_api_password: { file: ../secrets/rabbitmq_api_password }
  rabbitmq_worker_password: { file: ../secrets/rabbitmq_worker_password }
  rabbitmq_users: { file: ../secrets/rabbitmq_users.json }
  valkey_api_password: { file: ../secrets/valkey_api_password }
  valkey_health_password: { file: ../secrets/valkey_health_password }
  valkey_users_acl: { file: ../secrets/valkey_users.acl }
