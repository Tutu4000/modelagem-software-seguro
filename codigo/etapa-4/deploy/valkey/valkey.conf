# Shared state of the API replicas: revoked sessions and per-user rate limits
# (E5.1, E5.2). Only reachable on the internal network.
bind 0.0.0.0
port 6379
protected-mode yes

# Users and permissions come from the generated ACL file: the default user is
# off and every user has a password (stored only as a SHA-256 hash).
aclfile /run/secrets/valkey_users_acl

# AOF every second, so a revocation survives a Valkey restart. No RDB
# snapshots: the AOF is enough for this data.
dir /data
appendonly yes
appendfsync everysec
save ""

# The keys always carry a TTL, so memory stays small; if it ever fills up,
# refuse writes instead of evicting revocations.
maxmemory 64mb
maxmemory-policy noeviction
