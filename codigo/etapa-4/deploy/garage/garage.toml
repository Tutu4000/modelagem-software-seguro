# A single node with no replication: enough for the local environment.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/garage_rpc_secret"

# No anonymous access and no static website: every GET needs a signature (C03).
[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

# Used by garage-init, and by Prometheus for /metrics.
[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/run/secrets/garage_admin_token"
# Prometheus reads /metrics with its own token, which cannot administer.
metrics_token_file = "/run/secrets/garage_metrics_token"
