# Um nó só, sem réplica: o suficiente para o ambiente local.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/garage_rpc_secret"

# Sem acesso anônimo nem site estático: todo GET precisa de assinatura (C03).
[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

# Só na rede interna, usado pelo garage-init.
[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/run/secrets/garage_admin_token"
