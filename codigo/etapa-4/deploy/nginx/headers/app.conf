# An app and its API on one origin. The CSP comes from a map on the path:
# the app's for the pages and assets, the API's for the JSON.
include /etc/nginx/headers/common.conf;
add_header Content-Security-Policy $csp always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
