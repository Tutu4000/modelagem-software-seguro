# Garage downloads: read by the customer app and the panel, on the same site,
# through CORS (the 3D viewers, FE2 and FE5). Nothing here is a page.
# Garage answers "*" by default: only the apps' origins may read
# ($storage_cors_origin; an empty value sends no header).
proxy_hide_header Access-Control-Allow-Origin;
include /etc/nginx/headers/common.conf;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Access-Control-Allow-Origin $storage_cors_origin always;
add_header Vary "Origin" always;
