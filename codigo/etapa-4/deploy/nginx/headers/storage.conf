# Garage downloads: read by the customer app, on the same site, through CORS
# (the 3D viewer, FE2). Nothing here is a page.
# Garage answers "*" by default: only the customer app's origin may read.
proxy_hide_header Access-Control-Allow-Origin;
include /etc/nginx/headers/common.conf;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Access-Control-Allow-Origin "https://localhost" always;
add_header Vary "Origin" always;
