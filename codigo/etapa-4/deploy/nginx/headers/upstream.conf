# Keycloak and Grafana send some of these headers themselves. nginx drops
# theirs and sends its own, so each header goes out once, with one value.
# Their CSP and framing rules stay theirs.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
include /etc/nginx/headers/common.conf;
