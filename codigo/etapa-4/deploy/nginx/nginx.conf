# Single entry point (FC1): TLS, per-IP request and body size limits, and load
# balancing across the API replicas (E2.3, RS03).
#
# The security headers are left out on purpose: they are expected findings of
# the Stage 5 verification, and the fix is recorded there.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    default_type application/octet-stream;

    # Docker DNS: every new API replica joins the upstream without restarting
    # nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    upstream api {
        zone api 64k;
        server api:8080 resolve;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 100m;

        location /api/ {
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Overwrites whatever the client sent: the API only trusts this
            # nginx and uses this header as the origin of audit events.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        location / {
            return 404;
        }
    }

    # Downloads through Garage's presigned URLs. The Host header passes
    # unchanged, because the SigV4 signature covers it. Read-only: writes
    # belong to the API, over the internal network.
    server {
        listen 9443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            limit_except GET HEAD {
                deny all;
            }
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://garage:3900;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }
    }
}
