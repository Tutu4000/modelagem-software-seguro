# Único ponto de entrada (FC1): TLS, limite de requisições por IP e de tamanho
# do corpo, e balanceamento entre as réplicas da API (E2.3, RS03).
#
# Os cabeçalhos de segurança ficam de fora de propósito: são achados esperados
# da verificação da Etapa 5, e a correção é registrada lá.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    default_type application/octet-stream;

    # DNS do Docker: cada réplica nova da API entra no upstream sem reiniciar o
    # nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=10r/s;
    limit_req_status 429;

    upstream api {
        zone api 64k;
        server api:8080 resolve;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 100m;

        location /api/ {
            limit_req zone=por_ip burst=20 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Sobrescreve o que vier do cliente: a API só confia neste nginx e
            # usa este cabeçalho como origem dos eventos de auditoria.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        location / {
            return 404;
        }
    }

    # Downloads pelas URLs pré-assinadas do Garage. O Host segue sem mudança,
    # porque a assinatura SigV4 o cobre. Só leitura: a gravação é da API, pela
    # rede interna.
    server {
        listen 9443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            limit_except GET HEAD {
                deny all;
            }
            limit_req zone=por_ip burst=20 nodelay;

            proxy_pass http://garage:3900;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }
    }
}
