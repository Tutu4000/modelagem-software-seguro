# Single entry point (FC1): TLS, per-IP request and body size limits, load
# balancing across the API replicas (E2.3, RS03), the two web apps and the
# security headers (C09). The headers were left out until the Stage 5
# verification found them missing; they are on since FE0, and the new ZAP
# run is in evidencias/etapa-5/relatorios-zap-fe0.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Docker DNS: every new API replica joins the upstream without restarting
    # nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_status 429;

    # The CSP of each port, by path: the app gets the strict policy of a page,
    # the API the one of a JSON answer. Only 'self', Keycloak (login, and the
    # hidden frame that restores the session after a reload) and the Garage
    # downloads (3D viewer); no inline script or style, no eval, and Trusted
    # Types with one policy, nugget-worker, which turns into a script URL only
    # the app's own bundled workers under /assets/: no string ever becomes
    # HTML. Only the app's own pages may frame it: the session frame comes
    # back to the app's origin.
    map $uri $csp_customer {
        ~^/api/ "default-src 'none'; frame-ancestors 'none'";
        default "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://localhost:8444 https://localhost:8443; frame-src 'self' https://localhost:8444; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://localhost:8444; base-uri 'none'; frame-ancestors 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types nugget-worker";
    }
    map $uri $csp_panel {
        ~^/panel/ "default-src 'none'; frame-ancestors 'none'";
        default "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://localhost:8444 https://localhost:8443; frame-src 'self' https://localhost:8444; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://localhost:8444; base-uri 'none'; frame-ancestors 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types nugget-worker";
    }

    # The apps that read the designs from Garage through CORS: the customer's
    # 3D viewer and the technician's in the panel. Any other origin gets no
    # Access-Control-Allow-Origin, so its page cannot read the file.
    map $http_origin $storage_cors_origin {
        "https://localhost"      $http_origin;
        "https://localhost:9445" $http_origin;
        default                  "";
    }

    # `resolve` follows container restarts and new replicas without restarting
    # nginx.
    upstream api {
        zone api 64k;
        server api:8080 resolve;
    }

    upstream garage {
        zone garage 64k;
        server garage:3900 resolve;
    }

    upstream keycloak {
        zone keycloak 64k;
        server keycloak:8080 resolve;
    }

    upstream panel {
        zone panel 64k;
        server panel:8080 resolve;
    }

    upstream grafana {
        zone grafana 64k;
        server grafana:3000 resolve;
    }

    # Customer app and API (FC1).
    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 100m;

        set $csp $csp_customer;
        set $coop "same-origin";
        include /etc/nginx/headers/app.conf;

        location /api/ {
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Overwrites whatever the client sent: the API only trusts this
            # nginx and uses this header as the origin of audit events.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        # Not here, whatever the app's router would say: the panel lives on its
        # own port, and the back-channel logout and the metrics on the
        # internal listener.
        location /panel/ {
            return 404;
        }
        location /oidc/ {
            return 404;
        }
        location = /metrics {
            return 404;
        }

        # The hashed assets never change; the page always revalidates.
        location /assets/ {
            root /usr/share/nginx/customer;
            expires max;
            try_files $uri =404;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            root /usr/share/nginx/customer;
            expires -1;
            try_files $uri /index.html;
        }
    }

    # Downloads through Garage's presigned URLs. The Host header passes
    # unchanged, because the SigV4 signature covers it. Read-only: writes
    # belong to the API, over the internal network.
    server {
        listen 9443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        include /etc/nginx/headers/storage.conf;

        location / {
            limit_except GET HEAD {
                deny all;
            }
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://garage;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }
    }

    # Internal panel (D02, FC2): its app and its API. The port is published
    # only on the host's loopback, and here only the gateway of the public
    # network may connect: that is where loopback and SSH tunnel connections
    # arrive. Any other container or address gets 403. The panel routes do not
    # exist on 8443.
    server {
        listen 11443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 1m;

        allow 172.28.20.1;
        deny all;

        set $csp $csp_panel;
        # The step-up of a critical operation opens the login in a popup, and
        # the panel must keep talking to it.
        set $coop "same-origin-allow-popups";
        include /etc/nginx/headers/app.conf;

        location /panel/ {
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /metrics {
            return 404;
        }
        location /oidc/ {
            return 404;
        }

        location /assets/ {
            root /usr/share/nginx/panel;
            expires max;
            try_files $uri =404;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            root /usr/share/nginx/panel;
            expires -1;
            try_files $uri /index.html;
        }
    }

    # Grafana (C19): dashboards and alerts for the staff, published and
    # allowed exactly like the panel. Grafana has its own login and sends its
    # own CSP; nginx adds the rest.
    server {
        listen 12443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 1m;

        allow 172.28.20.1;
        deny all;

        include /etc/nginx/headers/upstream.conf;

        location / {
            limit_req zone=per_ip burst=40 nodelay;

            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Grafana Live uses a WebSocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
    }

    # Connection counters for the Prometheus exporter, on the internal
    # network only: no port publishes it.
    server {
        listen 8081;
        server_name nginx-status;

        allow 172.28.10.0/24;
        deny all;

        location = /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    # Keycloak: only the application realm is public. The admin console and
    # the master realm are not reachable from outside (E5.3). Keycloak sends
    # its own CSP and framing rules for the login pages; nginx adds the rest.
    server {
        listen 10443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 1m;

        include /etc/nginx/headers/upstream.conf;

        location /realms/nugget/ {
            limit_req zone=per_ip burst=20 nodelay;

            proxy_pass http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8444;
        }

        location /resources/ {
            proxy_pass http://keycloak;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            return 404;
        }
    }
}
