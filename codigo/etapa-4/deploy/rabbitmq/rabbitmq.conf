# As definições vêm de um diretório: a topologia, versionada aqui, e os
# usuários com o hash das senhas, gerados pelo `just secrets`. Sem elas o
# RabbitMQ não cria o usuário guest.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definicoes
loopback_users = none
