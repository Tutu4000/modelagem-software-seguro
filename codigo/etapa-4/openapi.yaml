openapi: 3.0.3
info:
  title: nugget-machine — public API
  version: 0.7.0
  description: >
    Customer routes. The panel routes live in another binary and do not exist
    here. Errors follow Problem Details (RFC 9457), without the internal cause.
servers:
  - url: https://localhost
security:
  - bearerAuth: []
paths:
  /api/v1/files:
    post:
      summary: Upload a binary STL
      description: >
        The file is validated before it is stored (RS03): up to 100 MB, binary
        STL structure and up to 2 million triangles.
      requestBody:
        required: true
        content:
          model/stl:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: File accepted and processing task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAccepted"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/files/{id}:
    get:
      summary: Processing status of one of the customer's own files
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Task status and, once done, the result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStatus"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/files/{id}/download:
    get:
      summary: Presigned URL to download one of the customer's own files
      description: >
        Only the owner gets the URL (RS01). Someone else's file and a missing
        file get the same 403 response. The URL is valid for 5 minutes.
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    format: uri
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/catalog:
    get:
      summary: Active price table, to build the order form
      responses:
        "200":
          description: Materials, colors, qualities, finishings, setup fee and volume discounts
          content:
            application/json:
              schema:
                type: object
                required: [version, currency, rules]
                properties:
                  version:
                    type: integer
                  currency:
                    type: string
                    example: BRL
                  rules:
                    $ref: "#/components/schemas/PriceRules"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/orders:
    post:
      summary: Quote an order from one of the customer's processed files
      description: >
        The price is computed only on the server, from the model volume and
        the active price table (CA03). The body has no price field, and any
        unknown field (such as total_cents or status) is refused with 400.
        The shipping price is quoted by the carrier for the address and
        added after the volume discount. The quote holds for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_id, material, color, quality, finishing, quantity, shipping]
              properties:
                file_id:
                  type: string
                  format: uuid
                material:
                  type: string
                color:
                  type: string
                quality:
                  type: string
                finishing:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                shipping:
                  $ref: "#/components/schemas/Address"
      responses:
        "201":
          description: Order quoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: The file is not processed yet (conflict)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/PartnerUnavailable"
    get:
      summary: The customer's orders, newest first (RF09)
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/orders/{id}:
    get:
      summary: One of the customer's orders, with its history, review, payment and tracking (RF12, RF20)
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/orders/{id}/submit:
    post:
      summary: Send a quoted order to technical review
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order awaiting review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: The order is not quoted (conflict) or the quote expired (quote_expired)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/orders/{id}/payment:
    post:
      summary: Pay an approved order through the gateway (RF08)
      description: >
        Creates the charge for the order total computed on the server. The
        answer is pending: the order becomes paid only when the gateway's
        signed notification arrives (see the callback). Calling again while
        the charge is live returns the same charge.
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "202":
          description: Charge pending at the gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: The order is not awaiting payment (conflict)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/PartnerUnavailable"
      callbacks:
        paymentSucceeded:
          "https://localhost/api/v1/webhooks/payments":
            post:
              $ref: "#/paths/~1api~1v1~1webhooks~1payments/post"
  /api/v1/webhooks/payments:
    post:
      summary: Payment notification from the gateway (C14)
      description: >
        Public route with no bearer token: the authentication is the
        X-Nugget-Signature header. A replayed event ID answers 200 with
        status duplicate and changes nothing. An event whose charge, order or
        amount does not match the order answers 400 and is audited as
        payment.rejected.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentEvent"
      responses:
        "200":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          description: Bad signature (invalid_signature) or an event that does not match (invalid_request)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/webhooks/shipping:
    post:
      summary: Pickup and delivery notifications from the carrier (C15)
      description: >
        Same scheme as the payments webhook, with the carrier's own secret.
        shipment.picked_up moves the order from in_production to shipped and
        shipment.delivered from shipped to delivered. The shipment must be
        the one booked for the order.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingEvent"
      responses:
        "200":
          $ref: "#/components/responses/WebhookAccepted"
        "400":
          description: Bad signature (invalid_signature) or an event that does not match (invalid_request)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    # Access token issued by Keycloak (realm "nugget") with audience "api"
    # and the realm role "customer". Browser apps use the "web" client with
    # authorization code + PKCE.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    # t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>"> with the
    # partner's secret. Timestamps more than 5 minutes off are refused.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Nugget-Signature
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://localhost:8444/realms/nugget/.well-known/openid-configuration
  parameters:
    OrderID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: >
        Error in the Problem Details format. A 401 also covers a token whose
        session was logged out or revoked. A 503 means the session store is
        down: the API fails closed instead of trusting the token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: >
        Rate limit exceeded: per IP at nginx, or per user (60 requests per
        minute) across all replicas, with code rate_limited.
      headers:
        Retry-After:
          description: Seconds until the user may try again
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PartnerUnavailable:
      description: >
        The gateway or the carrier did not answer (partner_unavailable). The
        order stays as it was (D03).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    WebhookAccepted:
      description: Event applied, or a replay of one already applied
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [applied, duplicate]
  schemas:
    Address:
      type: object
      description: >
        The minimum to deliver (LGPD). Shown to the customer, support and
        admin, never to the technician, and sent to the carrier only at
        pickup.
      additionalProperties: false
      required: [recipient, street, number, city, state, postal_code]
      properties:
        recipient:
          type: string
          minLength: 1
          maxLength: 120
        street:
          type: string
          minLength: 1
          maxLength: 120
        number:
          type: string
          minLength: 1
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          pattern: "^[A-Z]{2}$"
        postal_code:
          type: string
          pattern: "^[0-9]{5}-?[0-9]{3}$"
    Payment:
      type: object
      properties:
        charge_id:
          type: string
        amount_cents:
          type: integer
        status:
          type: string
          enum: [pending, succeeded]
        created_at:
          type: string
          format: date-time
    PaymentEvent:
      type: object
      required: [event_id, type, charge_id, order_id, amount_cents]
      properties:
        event_id:
          type: string
        type:
          type: string
          enum: [payment.succeeded]
        charge_id:
          type: string
        order_id:
          type: string
          format: uuid
        amount_cents:
          type: integer
    ShippingEvent:
      type: object
      required: [event_id, type, shipment_id, order_id]
      properties:
        event_id:
          type: string
        type:
          type: string
          enum: [shipment.picked_up, shipment.delivered]
        shipment_id:
          type: string
        order_id:
          type: string
          format: uuid
    UploadAccepted:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
    FileStatus:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [waiting, processing, done, failed]
        result:
          type: object
          properties:
            volume_mm3:
              type: number
            bbox_mm:
              type: array
              items:
                type: number
              minItems: 3
              maxItems: 3
    PriceRules:
      type: object
      properties:
        materials:
          type: object
          additionalProperties:
            type: object
            properties:
              name:
                type: string
              cents_per_cm3:
                type: integer
              colors:
                type: array
                items:
                  type: string
        qualities:
          type: object
          description: Multiplier in per mille (1000 keeps the material price)
          additionalProperties:
            type: integer
        finishings:
          type: object
          description: Cents per unit
          additionalProperties:
            type: integer
        setup_cents:
          type: integer
        discounts:
          type: array
          items:
            type: object
            properties:
              min_quantity:
                type: integer
              percent_off:
                type: integer
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        material:
          type: string
        color:
          type: string
        quality:
          type: string
        finishing:
          type: string
        quantity:
          type: integer
        price_table_version:
          type: integer
        unit_cents:
          type: integer
        discount_cents:
          type: integer
        shipping_cents:
          type: integer
          description: Carrier quote, added after the discount
        total_cents:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [quoted, awaiting_review, awaiting_payment, rejected, paid, in_production, shipped, delivered, cancelled]
        quote_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        shipping:
          $ref: "#/components/schemas/Address"
        tracking_code:
          type: string
        payment:
          $ref: "#/components/schemas/Payment"
        history:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                nullable: true
              to:
                type: string
              at:
                type: string
                format: date-time
        review:
          type: object
          nullable: true
          properties:
            decision:
              type: string
              enum: [approved, rejected]
            report:
              type: string
            reviewed_at:
              type: string
              format: date-time
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
