openapi: 3.0.3
info:
  title: nugget-machine — internal panel API
  version: 0.1.0
  description: >
    Staff routes (technician, support, admin), served by the panel binary on
    an address of its own, reachable only from the host's loopback or an SSH
    tunnel (D02). Every request needs a panel-web token from a browser login
    with password and TOTP (acr 2). Critical operations also need a login at
    most 5 minutes old (step-up, RFC 9470) and a written justification. Every
    request is recorded in the audit log.
servers:
  - url: https://localhost:9445
security:
  - oidc: []
paths:
  /panel/v1/me:
    get:
      summary: Who is logged in, and until when a critical operation is allowed
      responses:
        "200":
          description: The logged-in staff member
          content:
            application/json:
              schema:
                type: object
                required: [id, role, session, authenticated_at, step_up_needed_at]
                properties:
                  id:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum: [technician, support, admin]
                  session:
                    type: string
                  authenticated_at:
                    type: string
                    format: date-time
                  step_up_needed_at:
                    type: string
                    format: date-time
                    description: After this, a critical operation answers step_up_required
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /panel/v1/users/{id}/revoke:
    post:
      summary: Revoke a user (incident response, critical, admin only)
      description: >
        Cuts every existing token of the user in all replicas at once, then
        disables the account and ends its sessions in Keycloak. An admin
        cannot revoke themselves.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Justification"
      responses:
        "200":
          description: User revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  tokens:
                    type: string
                  enabled:
                    type: boolean
                  sessions:
                    type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          description: >
            Keycloak did not answer (idp_unavailable). The tokens were already
            cut; retry to disable the account.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://localhost:8444/realms/nugget/.well-known/openid-configuration
      description: >
        Client panel-web, authorization code with PKCE. The client always asks
        for acr 2 (password and TOTP).
  responses:
    Problem:
      description: Error in the Problem Details format (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: >
        No valid token (unauthenticated), no second factor (mfa_required), or,
        on a critical operation, a login older than 5 minutes
        (step_up_required). The last one carries the step-up challenge.
      headers:
        WWW-Authenticate:
          description: >
            On step_up_required: Bearer error="insufficient_user_authentication",
            max_age=300, acr_values="2". The front-end logs the user in again
            with these parameters.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Justification:
      type: object
      required: [justification]
      properties:
        justification:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the operation is needed. It goes to the audit log.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          enum:
            - unauthenticated
            - mfa_required
            - step_up_required
            - forbidden
            - invalid_request
            - justification_required
            - rate_limited
            - unavailable
            - idp_unavailable
            - internal
